name: tecnicoya-sprint01-tests
services:
  mysql-test:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: tecnicoya_test
      MYSQL_USER: tecnicoya_test
      MYSQL_PASSWORD: ${TEST_DB_PASSWORD:?Definir TEST_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${TEST_ROOT_PASSWORD:?Definir TEST_ROOT_PASSWORD}
    volumes:
      - mysql_test_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  api-test:
    build:
      context: ../backend/api
      dockerfile: docker/Dockerfile.local
    env_file:
      - ../backend/api/.env.testing
    environment:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_URL: http://localhost:8001
      FRONTEND_URL: http://localhost:5174
      APP_CONFIG_CACHE: /tmp/tecnicoya-sprint01-config.php
      DB_CONNECTION: mysql
      DB_HOST: mysql-test
      DB_PORT: 3306
      DB_DATABASE: tecnicoya_test
      DB_USERNAME: tecnicoya_test
      DB_PASSWORD: ${TEST_DB_PASSWORD:?Definir TEST_DB_PASSWORD}
      SESSION_DRIVER: database
      SESSION_COOKIE: tecnicoya_sprint01_session
      SESSION_SECURE_COOKIE: "false"
      SANCTUM_STATEFUL_DOMAINS: localhost:5174,localhost:8001
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
    volumes:
      - ../backend/api:/app
      - test_vendor:/app/vendor
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      mysql-test:
        condition: service_healthy
  frontend-test:
    image: node:24-bookworm-slim
    working_dir: /app
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5174", "--strictPort"]
    environment:
      VITE_API_URL: http://localhost:8001
    volumes:
      - ../frontend/web:/app
      - test_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5174:5174"
volumes:
  mysql_test_data:
  test_vendor:
  test_node_modules:
