name: tecnicoya-quality

# Servicios independientes: no arranca ni migra la base del producto.
services:
  sonar-db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    profiles: [quality]
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?Defina SONAR_DB_PASSWORD en .env.quality.local}
    volumes:
      - sonar_db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 512m

  sonarqube:
    image: sonarqube:26.9.0.129388-community@sha256:c0f1160bccfa435db4168c2d7df69af3c3ea7bfeb87395613014048fb33a68c1
    profiles: [quality]
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?Defina SONAR_DB_PASSWORD en .env.quality.local}
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    ulimits:
      nofile: {soft: 131072, hard: 131072}
      nproc: 8192
    mem_limit: 4g
    depends_on:
      sonar-db: {condition: service_healthy}

  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:12.2.0.4256_8.1.0@sha256:a3f4215076706c95a17a68c19322ee916e40a3acd081a8c1a1e839e0194afa57
    profiles: [quality]
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    working_dir: /usr/src
    volumes:
      - ../:/usr/src:ro
      - scanner_cache:/opt/sonar-scanner/.sonar/cache
    command: ["-Dsonar.working.directory=/tmp/sonar-work", "-Dsonar.qualitygate.wait=true"]
    mem_limit: 2g
    depends_on:
      - sonarqube

volumes:
  sonar_db:
  sonar_data:
  sonar_extensions:
  sonar_logs:
  scanner_cache:
