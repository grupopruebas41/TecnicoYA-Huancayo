services:
  # Motor del producto: MySQL 8.4 (DEF-12). Solo en la red interna; sin puerto publicado.
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: tecnicoya
      MYSQL_USER: tecnicoya
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - marketplace-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      retries: 30
  api:
    build: ../backend/api
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY:?Set a Laravel APP_KEY in your environment}
      APP_DEBUG: "false"
      CACHE_STORE: file
      SESSION_DRIVER: file
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: tecnicoya
      DB_USERNAME: tecnicoya
      DB_PASSWORD: ${DB_PASSWORD}
      PORT: 3000
  web:
    build: ../frontend/web
    ports:
      - "5173:5173"
    environment:
      API_URL: http://api:3000
      PORT: 5173
volumes:
  marketplace-mysql:
