sonar.projectKey=tecnicoya-huancayo
sonar.projectName=TecnicoYa Huancayo
sonar.projectVersion=sprint-03
sonar.sourceEncoding=UTF-8
sonar.sources=backend/api/app,backend/api/config,backend/api/routes,backend/api/database,frontend/web/src,frontend/web/server.mjs,infrastructure
sonar.tests=backend/api/tests,frontend/web/src,frontend/web/cypress
sonar.test.inclusions=backend/api/tests/**,frontend/web/src/**/*.test.js,frontend/web/src/**/*.test.jsx,frontend/web/src/test-setup.js,frontend/web/cypress/**
sonar.exclusions=**/*.test.js,**/*.test.jsx,**/test-setup.js
# No se excluye código histórico para ocultar hallazgos. No se declara cobertura
# sin generar y verificar un informe Clover/LCOV real.
# Cobertura PHP de Pest con PCOV: generar antes del análisis con
#   cd backend/api && composer test:sonar
# (rutas normalizadas a la raíz del repositorio). Solo importa el informe; no cambia umbrales ni reglas.
sonar.php.coverage.reportPaths=backend/api/test-results/clover.xml

# Generar con npm run test:coverage desde frontend/web antes del analisis.
sonar.javascript.lcov.reportPaths=frontend/web/coverage/lcov.info
